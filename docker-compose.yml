version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: octostrator_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octostrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octostrator123}
      POSTGRES_DB: ${POSTGRES_DB:-octostrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octostrator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: octostrator_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: octostrator_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@octostrator.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

  # Optional: RedisInsight for Redis management
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: octostrator_redis_insight
    ports:
      - "8001:8001"
    depends_on:
      - redis
    profiles:
      - debug

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: octostrator_network