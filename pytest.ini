[pytest]
# Pytest Configuration for AI PT Manager

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode
# asyncio_mode = auto  # Disabled due to pytest-asyncio plugin compatibility issue

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (optional)
# addopts = --cov=backend --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
